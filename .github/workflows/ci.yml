name: CI / CD

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: tdR606
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, curl

      - name: Install dependencies
        run: composer install

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 -prootpassword --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 1
          done
          exit 1

      - name: Start PHP server
        run: php -S 127.0.0.1:8080 &
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: tdR606

      - name: Wait for server
        run: |
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting for PHP server..."
            sleep 1
          done
          echo "Server did not start"
          exit 1

      - name: Run migrations
        run: php migrate.php
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: tdR606

      - name: Run tests
        run: vendor/bin/phpunit tests/
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: tdR606

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public
